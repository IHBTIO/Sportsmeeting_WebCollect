<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- 强制修改密码弹窗 -->
  <div id="pwdModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div class="modal-content" style="background:#fff; padding:24px; border-radius:10px; width:90%; max-width:400px;">
      <h3 style="color:var(--danger); margin-top:0;">⚠ 安全提示</h3>
      <p>您正在使用默认密码，请立即修改！</p>
      <input id="newPwdInput" type="password" placeholder="输入新密码（至少6位）" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">
      <div id="pwdMsg" class="message" style="display:none; color:red; margin-bottom:10px;"></div>
      <button id="doChangePwdBtn" class="btn btn-primary" style="width:100%; padding:10px;">确认修改</button>
    </div>
  </div>

  <div class="page wide">
    <section id="loginView" class="login-view" style="display:none;">
      <div class="login-card">
        <h1>系统登录</h1>
        <form id="loginForm">
          <input id="loginPass" type="password" placeholder="管理员密码">
          <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>
        <div id="loginMessage" class="message"></div>
      </div>
    </section>

    <section id="adminView" style="display:none;">
      <header class="header">
        <div class="header-row">
          <div><h1>数据后台</h1></div>
          <div class="header-actions"><button id="logoutBtn" class="btn btn-secondary">退出</button></div>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="stats">数据统计</button>
        <button class="tab" data-tab="records">报名数据</button>
        <button class="tab" data-tab="settings">系统设置</button>
        <button class="tab" data-tab="logs">操作日志</button>
      </nav>

      <!-- 统计 -->
      <div class="tab-panel" data-panel="stats">
        <div class="stats" id="statsBox"></div>
        <div class="charts-row">
          <div class="chart-card"><h3 class="card-title">项目占比</h3><div id="pieEvent"></div></div>
          <div class="chart-card"><h3 class="card-title">学部占比</h3><div id="pieDept"></div></div>
        </div>
      </div>

      <!-- 数据 -->
      <div class="tab-panel" data-panel="records" hidden>
        <div class="filter-card">
          <div class="filter-grid">
            <div class="field"><label>关键词</label><input id="fKeyword" type="text" placeholder="姓名/班级"></div>
            <div class="field"><label>学部</label><select id="fDept"><option value="">全部</option></select></div>
            <div class="field"><label>班级</label><select id="fClass"><option value="">全部</option></select></div>
            <div class="field"><label>性别</label><select id="fGender"><option value="">全部</option><option value="男">男</option><option value="女">女</option></select></div>
            <div class="field"><label>项目</label><select id="fProject"><option value="">全部</option></select></div>
          </div>
          <div class="filter-actions">
            <button id="applyFilterBtn" class="btn btn-primary">应用筛选</button>
            <button id="clearFilterBtn" class="btn btn-secondary">清空</button>
            <button id="exportBtn" class="btn btn-secondary">导出 Excel</button>
            <button id="batchDeleteBtn" class="btn btn-danger" disabled>删除选中</button>
            <button id="clearAllBtn" class="btn btn-danger" style="margin-left:auto;">一键清空</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th><input type="checkbox" id="selectAll"></th><th>#</th><th>学部</th><th>班级</th><th>姓名</th><th>性别</th><th>参赛项目</th><th>时间</th><th>操作</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>

      <!-- 设置 -->
      <div class="tab-panel" data-panel="settings" hidden>
        <div class="setting-card">
          <h3>报名控制</h3>
          <div class="setting-row">
            <label>最多报项数</label><input id="setMaxEvents" type="number" min="1" max="10" style="width:100px;"><button id="saveMaxEventsBtn" class="btn btn-primary">保存</button>
          </div>
          <div class="setting-row">
            <button id="toggleRegBtn" class="btn btn-toggle-open">关闭报名</button>
          </div>
          <div class="field"><label>滚动公告</label><textarea id="setNotice" rows="2"></textarea></div>
          <button id="saveNoticeBtn" class="btn btn-primary">保存公告</button>
        </div>
        <div class="setting-card">
          <h3>项目管理</h3>
          <div id="projList" class="project-list"></div>
          <div class="setting-row">
            <input id="newProjName" type="text" placeholder="项目名 (如 100米)">
            <button id="addProjBtn" class="btn btn-primary">添加</button>
          </div>
        </div>
      </div>

      <!-- 日志 -->
      <div class="tab-panel" data-panel="logs" hidden>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>时间</th><th>动作</th><th>详情</th></tr></thead><tbody id="logBody"></tbody></table></div>
      </div>

      <footer class="footer"><a href="/">← 返回报名页</a></footer>
    </section>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
